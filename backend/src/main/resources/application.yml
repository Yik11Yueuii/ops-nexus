server:
  port: ${PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: jdbc:h2:file:${OPSNEXUS_DATA_DIR:./runtime}/db/opsnexus;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 500ms
      timeout: 500ms
  jackson:
    default-property-inclusion: non_null
ops:
  chat-url: ${DEEPSEEK_CHAT_URL:https://api.deepseek.com/chat/completions}
  chat-model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
  data-dir: ${OPSNEXUS_DATA_DIR:./runtime}
  embedding-url: ${EMBEDDING_URL:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
  embedding-model: ${EMBEDDING_MODEL:text-embedding-v2}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.45}
  jwt-secret: ${JWT_SECRET:local-development-only-change-this-secret-2026}
  admin-password: ${DEMO_ADMIN_PASSWORD:OpsAdmin2026!}
  user-password: ${DEMO_USER_PASSWORD:OpsUser2026!}
  analytics-url: ${ANALYTICS_DB_URL:${spring.datasource.url}}
  analytics-username: ${ANALYTICS_DB_USERNAME:ops_analytics}
  analytics-password: ${ANALYTICS_DB_PASSWORD:ops-analytics-readonly}
  ai-rate-per-minute: ${AI_RATE_PER_MINUTE:10}
  ai-resilience:
    chat:
      connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:10s}
      response-timeout: ${DEEPSEEK_RESPONSE_TIMEOUT:60s}
      retry-max-attempts: ${DEEPSEEK_RETRY_MAX_ATTEMPTS:2}
      retry-wait-duration: ${DEEPSEEK_RETRY_WAIT_DURATION:200ms}
      circuit-sliding-window-size: ${DEEPSEEK_CIRCUIT_WINDOW:10}
      circuit-minimum-calls: ${DEEPSEEK_CIRCUIT_MIN_CALLS:5}
      circuit-failure-rate-threshold: ${DEEPSEEK_CIRCUIT_FAILURE_RATE:50}
      circuit-open-wait-duration: ${DEEPSEEK_CIRCUIT_OPEN_WAIT:10s}
      circuit-half-open-permitted-calls: ${DEEPSEEK_CIRCUIT_HALF_OPEN_CALLS:2}
    embedding:
      connect-timeout: ${DASHSCOPE_CONNECT_TIMEOUT:10s}
      response-timeout: ${DASHSCOPE_RESPONSE_TIMEOUT:30s}
      retry-max-attempts: ${DASHSCOPE_RETRY_MAX_ATTEMPTS:2}
      retry-wait-duration: ${DASHSCOPE_RETRY_WAIT_DURATION:200ms}
      circuit-sliding-window-size: ${DASHSCOPE_CIRCUIT_WINDOW:10}
      circuit-minimum-calls: ${DASHSCOPE_CIRCUIT_MIN_CALLS:5}
      circuit-failure-rate-threshold: ${DASHSCOPE_CIRCUIT_FAILURE_RATE:50}
      circuit-open-wait-duration: ${DASHSCOPE_CIRCUIT_OPEN_WAIT:10s}
      circuit-half-open-permitted-calls: ${DASHSCOPE_CIRCUIT_HALF_OPEN_CALLS:2}
  conversation-context:
    max-messages: ${CONVERSATION_CONTEXT_MAX_MESSAGES:8}
    max-chars: ${CONVERSATION_CONTEXT_MAX_CHARS:4000}
    ttl-seconds: ${CONVERSATION_CONTEXT_TTL_SECONDS:1800}
