spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:opsnexus}?useUnicode=true&characterEncoding=utf8&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=${DB_TIME_ZONE:Asia/Shanghai}
    username: ${DB_USERNAME:opsnexus}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # Initialize a newly-created MySQL database before recovery queries run.
      mode: always
      schema-locations: classpath:schema-mysql.sql
      encoding: UTF-8
ops:
  analytics-dialect: MySQL 8
  analytics-url: ${ANALYTICS_DB_URL:${spring.datasource.url}}
  analytics-username: ${ANALYTICS_DB_USERNAME:${DB_ANALYTICS_USERNAME:opsnexus_analytics}}
  analytics-password: ${ANALYTICS_DB_PASSWORD:${DB_ANALYTICS_PASSWORD:}}